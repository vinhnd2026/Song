<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a141f">
<title>Bài hát — Song</title>
<style>
* {box-sizing: border-box;}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; min-height: 100vh; color: #dfe3e6;
    background:
        radial-gradient(1100px 480px at 50% -120px, rgba(147,188,205,0.16), transparent 60%),
        linear-gradient(168deg, #0a141f 0%, #10222f 42%, #16303f 78%, #0d1a27 100%);
    background-attachment: fixed;
}
#rain {position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;}
.wrap {max-width: 860px; margin: 0 auto; padding: 56px 24px 90px; position: relative; z-index: 1;}
h1 {text-align: center; font-size: 40px; margin: 10px 0 6px; color: #f0ead9; letter-spacing: 0.06em;}
.sub {text-align: center; color: #c9a86a; letter-spacing: 0.34em; text-transform: uppercase; font-size: 13px; font-weight: 600;}
a.song {
    display: block; text-decoration: none; margin-top: 40px;
    background: linear-gradient(160deg, rgba(23,42,60,0.82), rgba(11,22,34,0.86));
    border: 1px solid rgba(147,188,205,0.16); border-radius: 18px;
    padding: 28px 32px; box-shadow: 0 14px 34px rgba(0,0,0,0.38);
    transition: all .2s ease;
}
a.song:hover {transform: translateY(-2px); border-color: rgba(201,168,106,0.4);}
a.song .cn {font-size: 30px; color: #f0ead9; letter-spacing: 0.08em;}
a.song .vn {display: block; margin-top: 6px; font-size: 18px; color: #c9a86a; font-weight: 600;}
a.song .desc {display: block; margin-top: 8px; font-size: 15px; color: #9db2bf; font-style: italic;}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
<h1>🎵 Bài hát</h1>
<div class="sub">Song · Học tiếng Trung qua lời bài hát</div>

<a class="song" href="Tan-Dong-Song-Ly-Biet.html">
  <span class="cn">情深深雨濛濛</span>
  <span class="vn">Tân Dòng Sông Ly Biệt</span>
  <span class="desc">“Tình sâu sâu, mưa mờ mờ — biết bao lầu đài chìm trong mưa khói” · Bấm vào từng chữ để xem pinyin, Hán Việt, bộ thủ, chiết tự và thứ tự nét viết.</span>
</a>
</div>
<script>
(function(){
  var c = document.getElementById('rain'), x = c.getContext('2d'), W, H, drops = [], clouds = [];
  function rs(){ W = c.width = innerWidth; H = c.height = innerHeight;
    drops = Array.from({length: Math.min(130, Math.floor(W/10))}, () => ({x: Math.random()*(W+100)-50, y: Math.random()*H, l: 11+Math.random()*14, s: 9+Math.random()*9, d: -1.2, o: 0.08+Math.random()*0.26}));
    clouds = Array.from({length: 7}, () => ({x: Math.random()*(W+500)-250, y: Math.random()*H*0.40+16, r: 130+Math.random()*210, s: 0.25+Math.random()*0.25, o: 0.16+Math.random()*0.09})); }
  function fr(){ x.clearRect(0,0,W,H);
    for (var cl of clouds){ var g = x.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);
      g.addColorStop(0, 'rgba(206,222,235,'+cl.o+')'); g.addColorStop(1, 'rgba(206,222,235,0)');
      x.fillStyle = g; x.save(); x.translate(cl.x, cl.y); x.scale(2.3, 0.6); x.translate(-cl.x, -cl.y);
      x.beginPath(); x.arc(cl.x, cl.y, cl.r, 0, Math.PI*2); x.fill(); x.restore();
      cl.x += cl.s; if (cl.x - cl.r*2.4 > W){ cl.x = -340; cl.y = Math.random()*H*0.36+10; } }
    x.lineWidth = 1; x.lineCap = 'round';
    for (var d of drops){ x.strokeStyle = 'rgba(174,199,216,'+d.o+')'; x.beginPath(); x.moveTo(d.x, d.y); x.lineTo(d.x + d.d*1.6, d.y + d.l); x.stroke();
      d.y += d.s; d.x += d.d; if (d.y > H){ d.y = -30; d.x = Math.random()*(W+100)-50; } }
    requestAnimationFrame(fr); }
  rs(); addEventListener('resize', rs);
  if (!(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) fr();
})();
</script>
</body>
</html>
